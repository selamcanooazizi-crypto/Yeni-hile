name: Jar derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle build --no-daemon
        working-directory: cekic-client
      - uses: actions/upload-artifact@v4
        with:
          name: cekic-client-jar
          path: cekic-client/build/libs/*.jar
